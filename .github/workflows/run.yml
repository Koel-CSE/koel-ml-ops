# Scheduled ops runner. Deliberately minimal — everything this actually
# does lives in a private repository and is fetched at run time via a
# scoped token; nothing about it is visible here beyond "something runs
# daily." Real command output is redirected to local files inside that
# private checkout and is never printed to this job's log or uploaded
# anywhere from this repo.
name: run

on:
  workflow_dispatch:
    inputs:
      opt_a:
        description: "a"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      opt_b:
        description: "b"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      opt_c:
        description: "c"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      opt_d:
        description: "d"
        required: false
        default: "hpe_with_ltr_fallback"
        type: choice
        options:
          - hpe_with_ltr_fallback
          - gated_ltr
          - hpe_with_fallback
          - gated_p90
          - gated
          - always_on
  schedule:
    - cron: "30 10 * * *"

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: "1"
        run: |
          git clone --depth 1 "https://x-access-token:${KOEL_REPO_PAT}@github.com/${KOEL_TARGET_REPO}.git" src > /dev/null 2>&1
          echo ok
        env:
          KOEL_REPO_PAT: ${{ secrets.KOEL_REPO_PAT }}
          KOEL_TARGET_REPO: ${{ secrets.KOEL_TARGET_REPO }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "2"
        working-directory: src
        run: |
          pip install -e ".[dev,ml]" > /dev/null 2>&1 && echo ok

      # Steps 3-5 are independent. The scripts they call keep running after
      # a failed stage and can still exit 0, so each step also fails when
      # a "stage N: failed" marker appears. continue-on-error lets later
      # steps still run; step 6 then fails the job if any of them failed.
      - name: "3"
        id: s3
        continue-on-error: true
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_LTR_SERVE: ${{ vars.ML_LTR_SERVE || '1' }}
          CSE_MIN_INTERVAL_SECONDS: "0.2"
          EVENT_NAME: ${{ github.event_name }}
          RUN_RETRAIN: ${{ github.event.inputs.opt_a || '' }}
          RUN_LTR_SHIP: ${{ github.event.inputs.opt_b || '' }}
          RUN_FORECAST: ${{ github.event.inputs.opt_c || '' }}
          FORECAST_MODE: ${{ github.event.inputs.opt_d || 'hpe_with_ltr_fallback' }}
          COPILOT_TASK_PAT: ${{ secrets.COPILOT_TASK_PAT }}
          KOEL_TARGET_REPO: ${{ secrets.KOEL_TARGET_REPO }}
        shell: bash
        run: |
          rc=0
          bash scripts/ci_ml_self_learn.sh | tee "$RUNNER_TEMP/run-3.out" || rc=$?
          if [ "$rc" -ne 0 ] || grep -Eq '^stage [0-9]+: failed$' "$RUNNER_TEMP/run-3.out"; then
            echo "::error::step 3 failed (exit $rc)"
            exit 1
          fi

      - name: "4"
        id: s4
        continue-on-error: true
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          rc=0
          bash scripts/ci_resolve_verdicts.sh | tee "$RUNNER_TEMP/run-4.out" || rc=$?
          if [ "$rc" -ne 0 ] || grep -Eq '^stage [0-9]+: failed$' "$RUNNER_TEMP/run-4.out"; then
            echo "::error::step 4 failed (exit $rc)"
            exit 1
          fi

      - name: "5"
        id: s5
        continue-on-error: true
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          rc=0
          bash scripts/ci_signal_ic_report.sh | tee "$RUNNER_TEMP/run-5.out" || rc=$?
          if [ "$rc" -ne 0 ] || grep -Eq '^stage [0-9]+: failed$' "$RUNNER_TEMP/run-5.out"; then
            echo "::error::step 5 failed (exit $rc)"
            exit 1
          fi

      - name: "6"
        if: always()
        env:
          S3: ${{ steps.s3.outcome }}
          S4: ${{ steps.s4.outcome }}
          S5: ${{ steps.s5.outcome }}
        run: |
          failed=0
          for s in "3:$S3" "4:$S4" "5:$S5"; do
            if [ "${s#*:}" = "failure" ]; then
              echo "::error::step ${s%%:*} failed"
              failed=1
            fi
          done
          exit "$failed"
