# Manual ops runner. Deliberately minimal — everything this actually
# does lives in a private repository and is fetched at run time via a
# scoped token; nothing about it is visible here beyond "something can
# be started by hand." No schedule. Real command output is redirected to
# local files inside that private checkout and is never printed to this
# job's log or uploaded anywhere from this repo.
name: train

on:
  workflow_dispatch: {}

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: "1"
        env:
          KOEL_REPO_PAT: ${{ secrets.KOEL_REPO_PAT }}
          KOEL_TARGET_REPO: ${{ secrets.KOEL_TARGET_REPO }}
        run: |
          git clone --depth 1 "https://x-access-token:${KOEL_REPO_PAT}@github.com/${KOEL_TARGET_REPO}.git" src > /dev/null 2>&1
          if [ ! -f src/scripts/ci_ml_cpu_full_train.sh ]; then
            rm -rf src
            git clone --depth 1 --branch cursor/gha-cpu-full-train-ff50 "https://x-access-token:${KOEL_REPO_PAT}@github.com/${KOEL_TARGET_REPO}.git" src > /dev/null 2>&1
          fi
          echo ok

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "2"
        working-directory: src
        run: pip install -e ".[ml]" > /dev/null 2>&1 && echo ok

      - name: "3"
        working-directory: src
        env:
          ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL || secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_WORKER_THREADS: "2"
        run: bash scripts/ci_ml_cpu_full_train.sh
