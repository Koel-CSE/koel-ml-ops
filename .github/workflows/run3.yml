# Scheduled ops runner, third instance — same pattern as run.yml
# (deliberately minimal; real logic lives in the private repo, fetched at
# run time via a scoped token; nothing about it is visible here beyond
# "something runs on weekdays"). Separate file for its own weekday
# schedule and long timeout.
name: run3

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 9 * * 1-5"

concurrency:
  group: run3
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: "1"
        run: |
          git clone --depth 1 "https://x-access-token:${KOEL_REPO_PAT}@github.com/${KOEL_TARGET_REPO}.git" src > /dev/null 2>&1
          echo ok
        env:
          KOEL_REPO_PAT: ${{ secrets.KOEL_REPO_PAT }}
          KOEL_TARGET_REPO: ${{ secrets.KOEL_TARGET_REPO }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "2"
        working-directory: src
        run: |
          pip install -e ".[ml]" > /dev/null 2>&1 && echo ok

      - name: "3"
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_SHADOW_DATABASE_URL: ${{ secrets.ML_SHADOW_DATABASE_URL }}
        run: |
          if [ ! -f scripts/ci_ml_live_shadow.sh ]; then
            echo skip
            exit 0
          fi
          bash scripts/ci_ml_live_shadow.sh
