# Check runner. Same pattern as run.yml: the checks themselves live in a
# private repository and are fetched at run time via a scoped token. Command
# output is written to a local file and never printed to this job's log;
# results are reported back to the private repository only.
name: ci

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "commit (blank = scan)"
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-scan
  cancel-in-progress: false

env:
  # Prefer the repository-scoped token for API reads and git fetches. The
  # status token may only have permission to write commit statuses.
  GH_TOKEN: ${{ secrets.KOEL_REPO_PAT || secrets.KOEL_STATUS_PAT }}
  READ_TOKEN_SECRET: ${{ secrets.KOEL_REPO_PAT && 'KOEL_REPO_PAT' || 'KOEL_STATUS_PAT' }}
  STATUS_TOKEN: ${{ secrets.KOEL_STATUS_PAT || secrets.KOEL_REPO_PAT }}
  STATUS_TOKEN_SECRET: ${{ secrets.KOEL_STATUS_PAT && 'KOEL_STATUS_PAT' || 'KOEL_REPO_PAT' }}
  KOEL_TARGET_REPO: ${{ secrets.KOEL_TARGET_REPO }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shas: ${{ steps.pick.outputs.shas }}
    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [[ -z "${KOEL_TARGET_REPO:-}" || ! "$KOEL_TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::KOEL_TARGET_REPO must be configured as owner/repository."
            exit 1
          fi
          if [[ -z "${GH_TOKEN:-}" || -z "${STATUS_TOKEN:-}" ]]; then
            echo "::error::KOEL_REPO_PAT and KOEL_STATUS_PAT are both unset. Set KOEL_REPO_PAT with Contents: read and Pull requests: read access to the target repository; commit status reporting also needs Commit statuses: write."
            exit 1
          fi
      - name: "1"
        id: pick
        env:
          FORCE_SHA: ${{ github.event.inputs.sha || '' }}
          OWN_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { gh api -H "Accept: application/vnd.github+json" "$@"; }
          # Already-checked commits are remembered as cache markers in this
          # repo, so the scan works without write access to the target. A
          # partial run must not suppress the stages that never completed.
          done_before() {
            local sha="$1" stage cached_keys
            for stage in unit integration web; do
              if ! cached_keys=$(GH_TOKEN="$OWN_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/actions/caches?key=ci-done-${sha}-${stage}" \
                -q '.actions_caches[].key' 2>/dev/null); then
                echo "::warning::Cannot list completion caches on $GITHUB_REPOSITORY - check GITHUB_TOKEN actions:read permission; treating this stage as unchecked." >&2
                cached_keys=""
              fi
              if ! grep -Fxq "ci-done-${sha}-${stage}" <<< "$cached_keys"; then
                echo 0
                return 0
              fi
            done
            echo 1
          }
          # Optional: report back as commit statuses when the token allows.
          mark() {
            for ctx in lint-typecheck-unit migrate-and-db-tests web-lint-typecheck-smoke; do
              if ! GH_TOKEN="$STATUS_TOKEN" api -X POST "repos/$KOEL_TARGET_REPO/statuses/$1" \
                -f state=pending -f context="koel-ci/$ctx" -f description="queued" > /dev/null 2>&1; then
                echo "::warning::Cannot post queued commit status on $KOEL_TARGET_REPO - check $STATUS_TOKEN_SECRET Commit statuses: write access." >&2
                return 0
              fi
            done
          }
          picked=()
          if [[ -n "$FORCE_SHA" ]]; then
            if [[ ! "$FORCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::The requested sha must be a full 40-character commit SHA."
              exit 1
            fi
            picked+=("$FORCE_SHA")
          else
            if ! pulls_json=$(api "repos/$KOEL_TARGET_REPO/pulls?state=open&sort=updated&direction=desc&per_page=50" 2>&1); then
              api_status=$(grep -oE 'HTTP [0-9]{3}' <<<"$pulls_json" | head -1 || true)
              echo "::error::Cannot list pull requests on $KOEL_TARGET_REPO - check $READ_TOKEN_SECRET Pull requests: read access (${api_status:-API request failed})."
              exit 1
            fi
            if ! jq -e 'type == "array"' <<<"$pulls_json" > /dev/null 2>&1; then
              echo "::error::GitHub returned an unexpected pull request response for $KOEL_TARGET_REPO."
              exit 1
            fi
            if ! main_json=$(api "repos/$KOEL_TARGET_REPO/commits/main" 2>&1); then
              api_status=$(grep -oE 'HTTP [0-9]{3}' <<<"$main_json" | head -1 || true)
              echo "::error::Cannot read main commit on $KOEL_TARGET_REPO - check KOEL_TARGET_REPO and $READ_TOKEN_SECRET Contents: read access (${api_status:-API request failed})."
              exit 1
            fi
            if ! main_sha=$(jq -er '.sha | select(type == "string" and test("^[0-9a-fA-F]{40}$"))' <<<"$main_json" 2>/dev/null); then
              echo "::error::GitHub did not return a valid main commit SHA for $KOEL_TARGET_REPO."
              exit 1
            fi
            heads=$(
              {
                printf '%s\n' "$main_sha"
                jq -r '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.sha | select(test("^[0-9a-fA-F]{40}$"))' <<<"$pulls_json"
              } | awk '!seen[$0]++'
            )
            for sha in $heads; do
              if [[ "$(done_before "$sha")" == "0" ]]; then picked+=("$sha"); fi
              [[ ${#picked[@]} -ge 4 ]] && break
            done
          fi
          for sha in "${picked[@]}"; do mark "$sha"; done
          echo "shas=$(jq -cn '$ARGS.positional' --args "${picked[@]}")" >> "$GITHUB_OUTPUT"
          echo ok

  check:
    needs: scan
    if: needs.scan.outputs.shas != '[]'
    name: "c ${{ strategy.job-index }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sha: ${{ fromJSON(needs.scan.outputs.shas) }}
        stage:
          - { key: unit, ctx: lint-typecheck-unit }
          - { key: integration, ctx: migrate-and-db-tests }
          - { key: web, ctx: web-lint-typecheck-smoke }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koel
          POSTGRES_PASSWORD: koel
          POSTGRES_DB: koel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koel -d koel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHA: ${{ matrix.sha }}
      CTX: koel-ci/${{ matrix.stage.ctx }}
      LOG: /tmp/koel-c.log
    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [[ -z "${KOEL_TARGET_REPO:-}" || ! "$KOEL_TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::KOEL_TARGET_REPO must be configured as owner/repository."
            exit 1
          fi
          if [[ -z "${GH_TOKEN:-}" || -z "${STATUS_TOKEN:-}" ]]; then
            echo "::error::KOEL_REPO_PAT and KOEL_STATUS_PAT are both unset. Set KOEL_REPO_PAT with Contents: read and Pull requests: read access to the target repository; commit status reporting also needs Commit statuses: write."
            exit 1
          fi
      - name: "1"
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Refusing to fetch invalid commit SHA: $SHA"
            exit 1
          fi
          if ! GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$KOEL_TARGET_REPO/statuses/$SHA" -f state=pending \
            -f context="$CTX" -f description="running" > /dev/null 2>&1; then
            echo "::warning::Cannot post running commit status on $KOEL_TARGET_REPO - check $STATUS_TOKEN_SECRET Commit statuses: write access."
          fi
          git init -q src
          git -C src remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${KOEL_TARGET_REPO}.git"
          if ! git -C src fetch -q --depth 1 origin "$SHA" > /dev/null 2>&1; then
            echo "::error::Cannot fetch $SHA from $KOEL_TARGET_REPO. Check $READ_TOKEN_SECRET has Contents: read access and the commit exists."
            exit 1
          fi
          if ! git -C src checkout -q FETCH_HEAD > /dev/null 2>&1; then
            echo "::error::Cannot check out fetched commit $SHA from $KOEL_TARGET_REPO."
            exit 1
          fi
          # Older open-PR heads can predate the centralized check runner.
          # Use the version from main in that case, while keeping the checked
          # commit itself as the working tree under test.
          if ! git -C src show "$SHA:scripts/pr_checks.sh" > "$RUNNER_TEMP/pr_checks.sh" 2>/dev/null; then
            if ! git -C src fetch -q --depth 1 origin main > /dev/null 2>&1; then
              echo "::error::Cannot fetch scripts/pr_checks.sh from main in $KOEL_TARGET_REPO - check $READ_TOKEN_SECRET Contents: read access."
              exit 1
            fi
            if ! git -C src show FETCH_HEAD:scripts/pr_checks.sh > "$RUNNER_TEMP/pr_checks.sh" 2>/dev/null; then
              echo "::error::scripts/pr_checks.sh is missing from both $SHA and main in $KOEL_TARGET_REPO."
              exit 1
            fi
          fi
          git -C src remote remove origin
          echo ok

      - if: matrix.stage.key != 'web'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: matrix.stage.key == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "2"
        id: run
        working-directory: src
        env:
          DATABASE_URL: ${{ matrix.stage.key == 'integration' && 'postgresql://koel:koel@localhost:5432/koel' || '' }}
        run: |
          bash "$RUNNER_TEMP/pr_checks.sh" "${{ matrix.stage.key }}" > "$LOG" 2>&1 && echo ok

      - name: "3"
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
          LOG_PUBKEY: ${{ secrets.KOEL_LOG_PUBKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          touch "$LOG"
          # GitHub also starts this shell with -e. No marker is a valid
          # setup failure, not a reason to abort reporting and diagnostics.
          last_step=$(grep -o '::koel-ci-step:: .*' "$LOG" | tail -1 | sed 's/::koel-ci-step:: //' || true)
          case "$OUTCOME" in
            success) state=success; desc="passed" ;;
            failure) state=failure; desc="failed at: ${last_step:-setup}" ;;
            *)       state=error;   desc="runner ${OUTCOME:-error}" ;;
          esac
          if ! GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$KOEL_TARGET_REPO/statuses/$SHA" -f state="$state" \
            -f context="$CTX" -f description="${desc:0:139}" -f target_url="$RUN_URL" > /dev/null 2>&1; then
            echo "::warning::Cannot post final commit status on $KOEL_TARGET_REPO - check $STATUS_TOKEN_SECRET Commit statuses: write access."
          fi
          if [[ "$state" != success ]]; then
            {
              echo "**$CTX** $desc"
              echo
              echo '```'
              grep -v '::koel-ci-step::' "$LOG" | tail -n 80 | cut -c1-300 || true
              echo '```'
            } > "$RUNNER_TEMP/body.md"
            if ! gh api -X POST "repos/$KOEL_TARGET_REPO/commits/$SHA/comments" \
              -F body=@"$RUNNER_TEMP/body.md" > /dev/null 2>&1; then
              echo "::warning::Cannot post commit diagnostics on $KOEL_TARGET_REPO - check $READ_TOKEN_SECRET Contents: write access (optional)."
            fi
          fi
          if [[ "$state" != success && -n "${LOG_PUBKEY:-}" ]]; then
            printf '%s\n' "$LOG_PUBKEY" > "$RUNNER_TEMP/k.pub"
            k=$(openssl rand -hex 32)
            ek=$(printf '%s' "$k" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/k.pub" | base64 -w0)
            eb=$(tail -n 300 "$LOG" | gzip -9 | openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:$k" | base64 -w0)
            echo "d1:$ek"
            echo "d2:$eb"
          fi
          [[ "$state" == success ]] && echo ok || echo fail
          [[ "$state" == success ]]

      - name: "4"
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          # Record completed checks independently of status/log reporting.
          # Cancelled or infrastructure-skipped checks remain retryable.
          case "$OUTCOME" in
            success|failure)
              mkdir -p "$RUNNER_TEMP/marker"
              printf '%s\n' "$OUTCOME" > "$RUNNER_TEMP/marker/state"
              ;;
          esac

      - name: "5"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/marker
          key: ci-done-${{ matrix.sha }}-${{ matrix.stage.key }}
