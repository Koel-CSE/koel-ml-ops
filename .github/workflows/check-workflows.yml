name: checks

on:
  push:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/check-workflows.yml
      - tests/**
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/check-workflows.yml
      - tests/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python -m unittest discover -s tests -v
