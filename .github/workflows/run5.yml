# Scheduled ops runner, fifth instance — same pattern as run.yml/run2.yml
# (deliberately minimal; real logic lives in the private repo, fetched at
# run time via a scoped token; public output is terse stage markers only).
# Weekday daytime cadence plus one manual mode with two date inputs.
name: run5

on:
  workflow_dispatch:
    inputs:
      m:
        description: "m"
        required: false
        default: "a"
        type: choice
        options: ["a", "b", "c", "d", "e"]
      x:
        description: "x"
        required: false
        default: ""
        type: string
      y:
        description: "y"
        required: false
        default: ""
        type: string
  # GitHub drops/delays most cron fires on this repo (15-min crons fire every
  # ~2-3h), so one fire starts a session-long loop (mode d) instead of relying
  # on many short runs. Several fires as backups; extras queue and no-op.
  schedule:
    - cron: "50 3 * * 1-5"
    - cron: "20 4 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 8 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: run5
  cancel-in-progress: false

jobs:
  run:
    if: inputs.m != 'e'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: "1"
        env:
          KOEL_REPO_PAT: ${{ secrets.KOEL_REPO_PAT }}
          KOEL_TARGET_REPO: ${{ secrets.KOEL_TARGET_REPO }}
        run: |
          git clone --depth 1 "https://x-access-token:${KOEL_REPO_PAT}@github.com/${KOEL_TARGET_REPO}.git" src > /dev/null 2>&1
          test -f src/scripts/ci_prices.sh
          echo ok

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "2"
        working-directory: src
        run: pip install -e . > /dev/null 2>&1 && echo ok

      - name: "3"
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          M: ${{ inputs.m || 'd' }}
          X: ${{ inputs.x || '' }}
          Y: ${{ inputs.y || '' }}
        run: |
          case "$M" in
            a) bash scripts/ci_prices.sh poll ;;
            b) bash scripts/ci_prices.sh eod ;;
            c) bash scripts/ci_prices.sh backfill "$X" "$Y" ;;
            d)
              # Market-session loop: a tick every 5 min until 14:35 SLT (09:05 UTC),
              # then the day's EOD bars once. Single tick failures don't stop the loop.
              end=$(date -u -d "today 09:05" +%s); n=0; bad=0
              while [ "$(date -u +%s)" -lt "$end" ]; do
                t0=$(date -u +%s)
                if bash scripts/ci_prices.sh poll > /dev/null 2>&1; then :; else bad=$((bad+1)); fi
                n=$((n+1))
                left=$(( 300 - ( $(date -u +%s) - t0 ) )); [ "$left" -gt 0 ] && sleep "$left"
              done
              echo "ticks=$n failed=$bad"
              if [ "$n" -gt 0 ]; then bash scripts/ci_prices.sh eod; fi
              if [ "$n" -gt 0 ] && [ $((bad * 2)) -gt "$n" ]; then echo "stage 9: failed"; exit 1; fi
              ;;
            *) echo "stage 0: failed"; exit 1 ;;
          esac

      # If the loop died mid-session (runner loss, timeout), start a fresh one.
      # workflow_dispatch from GITHUB_TOKEN is allowed to create a new run.
      - name: "4"
        if: failure() && (inputs.m || 'd') == 'd'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d 'today 08:50' +%s)" ]; then
            gh workflow run run5.yml -R "$GITHUB_REPOSITORY" -f m=d && echo restarted
          fi

  arch:
    if: inputs.m == 'e'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "1"
        run: pip install "psycopg[binary]" certifi > /dev/null 2>&1 && echo ok
      - name: "2"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, certifi, gzip, psycopg
          os.environ.setdefault("PGSSLROOTCERT", certifi.where())
          q = "SELECT * FROM price_snapshots WHERE ts < now() - interval '13 days' ORDER BY id"
          n = 0
          with psycopg.connect(os.environ["DATABASE_URL"]) as c, gzip.open("a.csv.gz", "wb", 6) as f:
              with c.cursor().copy(f"COPY ({q}) TO STDOUT WITH (FORMAT csv, HEADER true)") as cp:
                  for chunk in cp:
                      f.write(chunk); n += bytes(chunk).count(b"\n")
              total = c.execute("SELECT count(*) FROM price_snapshots").fetchone()[0]
          print(f"lines={n} table_total={total}")
          PY
          sha256sum a.csv.gz | cut -c1-16
      - name: "3"
        run: |
          cat > k.pub <<'K'
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAp7qn3YYRoW/C2SUSGIfC
            0qnaEX2txNmjD5ZycquiZnO51pj/JpszisJLtrvq956lxoVGSQhU0xda359Q4ltY
            KW40kkqw/usCI2fe9ctIMh3AGaSK58oUtGQ+7BW80lSlLsYRKvV6pn7akr/YSsNr
            D6UGWlP6u2nbcuXmZhZRROIDsZrXZ4T1syPrqLueoXdBaGa6Y6YRlNQLnFpndheh
            LZONj9Wx0Wg8Qs1gIrk1DZnq7PtR2qnYtDI/5VEUFv7MKT4gbvLVUaFypzcNCNo2
            ky1mSjcN1iQ+KAIVCaM58S1Zwjevenit0y7Vh0D57NErGql/PTfTM/q3HyWn/biH
            3pKUhNLHB6YBp3OxWMHtoAlNduuuHjlHNlfdr4h3PFT5xoM5KnXipQQQURGavaHq
            gbgyDyEllyRtCwIx9J3ytN6+a2SB+cCoYgNKdOQLHv/TFld/wpUfQ8e53nc+lsjD
            47RK7uILvy2VgbQTz9hS8O+r+hhSy51CNUCdtRvZAIJJAgMBAAE=
            -----END PUBLIC KEY-----
          K
          sed -i 's/^ *//' k.pub
          k=$(openssl rand -hex 32)
          printf '%s' "$k" | openssl pkeyutl -encrypt -pubin -inkey k.pub -out k.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:$k" -in a.csv.gz -out a.enc
          rm -f a.csv.gz; ls -l a.enc | awk '{print $5}'
      - name: "4"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "a-${{ github.run_id }}" a.enc k.enc -R "$GITHUB_REPOSITORY" --prerelease -t a -n a > /dev/null && echo ok
